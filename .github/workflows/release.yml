name: Release

# Tag `v1.x` on the alwaysstrong branch (or run this workflow with a tag) and
# the three installable zips are built on the runner and attached to the
# release. Nothing is uploaded by hand.
#
#   AlwaysStrong-<ver>.zip           PlayIntegrityFork  + TEESimulator-RS
#   AlwaysStrong-<ver>-inject.zip    PlayIntegrityFix   + TEESimulator-RS
#   AlwaysStrong-<ver>-nopif.zip     PIF-less / Lite    + TEESimulator-RS
#
# After publishing, the three update manifests on the branch are repointed at
# the new tag so installed modules pick the release up through their manager.

on:
  push:
    tags:
      - 'v1.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.0.6)'
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip

      - name: Use committed native binaries (skip the cargo-ndk step in CI)
        run: find native -path '*/prebuilt/*' -type f -exec touch {} +

      - name: Build the three lines
        run: bash build.sh

      - name: Release notes from CHANGELOG
        run: |
          set -eu
          {
            echo "## AlwaysStrong ${TAG}"
            echo
            awk -v v="## ${TAG}" '
              $0==v {f=1; next}
              /^## / {f=0}
              f {print}
            ' CHANGELOG.md
          } > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            printf '## AlwaysStrong %s\n\nSee CHANGELOG.md.\n' "$TAG" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            out/AlwaysStrong-*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      - name: Point the update manifests at this release
        # Installed modules poll their updateJson, so it has to name a release
        # that already exists - hence this runs after publish. A failure here
        # costs an edit, not the build.
        continue-on-error: true
        run: |
          set -eu
          ver=$(sed -n 's/^version=//p' module/module.prop)
          code=$(sed -n 's/^versionCode=//p' module/module.prop)
          git fetch origin alwaysstrong
          git checkout -B alwaysstrong origin/alwaysstrong
          write_manifest() {
            printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "https://github.com/%s/releases/download/%s/%s",\n  "changelog": "https://raw.githubusercontent.com/%s/alwaysstrong/CHANGELOG.md"\n}\n' \
              "$ver" "$code" "$GITHUB_REPOSITORY" "$TAG" "$2" "$GITHUB_REPOSITORY" > "$1"
          }
          write_manifest update.json        "AlwaysStrong-${ver}.zip"
          write_manifest update-inject.json "AlwaysStrong-${ver}-inject.zip"
          write_manifest update-nopif.json  "AlwaysStrong-${ver}-nopif.zip"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json update-inject.json update-nopif.json
          git diff --cached --quiet && { echo "manifests already current"; exit 0; }
          git commit -m "chore: point update manifests at $TAG"
          git push origin alwaysstrong
