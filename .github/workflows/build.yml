name: Build

# Branch build for the AlwaysStrong packaging line. Every push here produces
# the three installable zips as workflow artifacts (never a release):
#   AlwaysStrong.zip           PlayIntegrityFork + TEESimulator-RS
#   AlwaysStrong-inject.zip    PlayIntegrityFix inject-s + TEESimulator-RS
#   AlwaysStrong-nopif.zip     PIF-less / Lite + TEESimulator-RS
#
# The attestation engine is the MashiroSann/TEESimulator-RS release pinned in
# build.sh (currently v6.0.1-367, Release-NoEnhanced, arm64-v8a). No engine or
# WebUI source from that project is vendored here: this branch is the
# AlwaysStrong module (scripts + automation + WebUI) around that engine.

on:
  push:
    branches: [alwaysstrong]
    paths:
      - 'module/**'
      - 'module-variants/**'
      - 'attest/**'
      - 'native/**'
      - 'banner.png'
      - 'build.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip unzip

      - name: Use committed native binaries (skip the cargo-ndk step in CI)
        run: find native -path '*/prebuilt/*' -type f -exec touch {} +

      - name: Build the three lines
        run: |
          set -eu
          tag="$(git rev-list --count HEAD)-$(git rev-parse --short=7 HEAD)-ci"
          bash build.sh --build-tag "$tag"

      - name: Collect version-less artifact names
        run: |
          set -eu
          mkdir -p dist
          for z in out/AlwaysStrong-*.zip; do
            case "$z" in
              *-inject.zip) cp "$z" dist/AlwaysStrong-inject.zip ;;
              *-nopif.zip)  cp "$z" dist/AlwaysStrong-nopif.zip ;;
              *)            cp "$z" dist/AlwaysStrong.zip ;;
            esac
          done
          ls -la dist

      - name: Upload default build
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong
          path: dist/AlwaysStrong.zip
          if-no-files-found: error

      - name: Upload inject build
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-inject
          path: dist/AlwaysStrong-inject.zip
          if-no-files-found: error

      - name: Upload nopif build
        uses: actions/upload-artifact@v4
        with:
          name: AlwaysStrong-nopif
          path: dist/AlwaysStrong-nopif.zip
          if-no-files-found: error
